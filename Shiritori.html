<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>しりとり</title>
<style>
:root {
  --bg: #0f1419;
  --surface: #1a2332;
  --surface2: #243044;
  --border: #2d3a4f;
  --text: #e8eef6;
  --muted: #8b9bb4;
  --accent: #3d8bfd;
  --accent-hover: #5ba0ff;
  --success: #3dd68c;
  --danger: #f07178;
  --warn: #e6c07b;
  --player: #5cc8ff;
  --cpu: #c792ea;
  --radius: 14px;
  --tap: 48px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
body {
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  padding: 16px 16px 8px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}
header .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.controls {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.controls label { font-size: 0.8rem; color: var(--muted); }
select, button, input[type="text"] {
  font: inherit;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  min-height: var(--tap);
  padding: 0 14px;
}
select { flex: 1; min-width: 100px; cursor: pointer; }
button {
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.15s, transform 0.1s;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-ghost { background: transparent; color: var(--muted); }
.status-bar {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.badge-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.badge.turn-player { border-color: var(--player); color: var(--player); }
.badge.turn-cpu { border-color: var(--cpu); color: var(--cpu); }
.badge.sound {
  background: linear-gradient(135deg, #1e3a5f, #2a4a6f);
  border-color: var(--accent);
  color: #fff;
  font-size: 1.1rem;
  letter-spacing: 0.05em;
}
.badge.sound span.kana { font-size: 1.35rem; }
.next-hint { font-size: 0.85rem; color: var(--muted); }
.next-hint strong { color: var(--warn); font-size: 1.15rem; }
.message {
  margin: 0 16px;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  display: none;
}
.message.show { display: block; }
.message.error { background: rgba(240,113,120,0.15); border: 1px solid var(--danger); color: var(--danger); }
.message.win { background: rgba(61,214,140,0.15); border: 1px solid var(--success); color: var(--success); }
.message.lose { background: rgba(240,113,120,0.15); border: 1px solid var(--danger); color: var(--danger); }
.message.info { background: rgba(61,139,253,0.12); border: 1px solid var(--accent); color: var(--player); }
.history-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px 16px;
  -webkit-overflow-scrolling: touch;
}
.history-title {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.history {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.history-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.history-item .who {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 700;
}
.history-item.player .who { background: rgba(92,200,255,0.2); color: var(--player); }
.history-item.cpu .who { background: rgba(199,146,234,0.2); color: var(--cpu); }
.history-item .word { flex: 1; min-width: 0; }
.history-item .surface { font-size: 1.05rem; font-weight: 600; word-break: break-all; }
.history-item .reading { font-size: 0.8rem; color: var(--muted); }
.history-item .num { font-size: 0.7rem; color: var(--muted); align-self: center; }
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 0.9rem;
}
.input-area {
  padding: 12px 16px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  position: sticky;
  bottom: 0;
}
.input-row {
  display: flex;
  gap: 8px;
}
.input-row input {
  flex: 1;
  font-size: 1.1rem;
  min-width: 0;
}
.input-row button { min-width: 72px; }
.surrender-row {
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
.surrender-row button {
  min-height: 40px;
  font-size: 0.85rem;
  padding: 0 16px;
}
.dict-count {
  font-size: 0.7rem;
  color: var(--muted);
  text-align: center;
  padding: 4px;
}
</style>
</head>
<body>
<header>
  <h1>しりとり</h1>
  <div class="subtitle">人 vs コンピューター</div>
</header>

<div class="controls">
  <label for="difficulty">難易度</label>
  <select id="difficulty" aria-label="難易度">
    <option value="easy">初級</option>
    <option value="medium" selected>中級</option>
    <option value="hard">上級</option>
  </select>
  <button type="button" class="btn-primary" id="btnNew">新しいゲーム</button>
</div>

<div class="status-bar">
  <div class="badge-row">
    <span class="badge" id="turnBadge">準備中</span>
    <span class="badge sound" id="soundBadge" style="display:none">次: <span class="kana" id="nextSound">—</span></span>
  </div>
  <div class="next-hint" id="nextHint">「新しいゲーム」を押してスタート</div>
</div>

<div class="message" id="message" role="alert"></div>

<div class="history-wrap">
  <div class="history-title">履歴</div>
  <div class="history" id="history">
    <div class="empty-state" id="emptyState">まだ言葉がありません</div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <input type="text" id="wordInput" placeholder="ことばを入力…" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="done" disabled>
    <button type="button" class="btn-primary" id="btnSubmit" disabled>送信</button>
  </div>
  <div class="surrender-row">
    <button type="button" class="btn-danger" id="btnSurrender" disabled>降参する</button>
  </div>
  <div class="dict-count" id="dictCount"></div>
</div>

/* ========== Kana utilities ========== */
const KATA_TO_HIRA = (() => {
  const map = {};
  // Map ァ-ン (and ヴ) only — do NOT map ー (U+30FC) or punctuation
  for (let code = 0x30A1; code <= 0x30F6; code++) {
    map[String.fromCharCode(code)] = String.fromCharCode(code - 0x60);
  }
  return map;
})();

const SMALL_TO_LARGE = {
  'ゃ':'や','ゅ':'ゆ','ょ':'よ',
  'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お',
  'っ':'つ','ゎ':'わ'
};

function toHiragana(str) {
  let out = '';
  for (const ch of str) {
    if (KATA_TO_HIRA[ch]) out += KATA_TO_HIRA[ch];
    else out += ch;
  }
  return out;
}

function normalizeFW(str) {
  return str.replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
            .replace(/\u3000/g, ' ');
}

function normalizeReading(raw) {
  let s = normalizeFW(String(raw).trim());
  s = toHiragana(s);
  s = s.replace(/[\s\u3000]/g, '');
  return s;
}

/** Get the chain-end sound from a hiragana reading (rules 6,7) */
function getEndSound(reading) {
  if (!reading || reading.length === 0) return null;
  let s = reading;
  // Strip trailing ー: chain from char immediately before ー
  while (s.length > 0 && s[s.length - 1] === 'ー') {
    s = s.slice(0, -1);
  }
  if (s.length === 0) return null;
  let last = s[s.length - 1];
  // Small kana → large
  if (SMALL_TO_LARGE[last]) last = SMALL_TO_LARGE[last];
  return last;
}

/** Get the chain-start sound from a hiragana reading */
function getStartSound(reading) {
  if (!reading || reading.length === 0) return null;
  let first = reading[0];
  if (SMALL_TO_LARGE[first]) first = SMALL_TO_LARGE[first];
  return first;
}

function endsWithN(reading) {
  const end = getEndSound(reading);
  return end === 'ん';
}

/* ========== Dictionary index ========== */
const bySurface = new Map(); // surface -> entry
const byReading = new Map(); // reading -> [entries]
const allEntries = [];

for (const entry of DICTIONARY) {
  const readings = entry.readings.map(normalizeReading).filter(Boolean);
  if (readings.length === 0) continue;
  const e = { surface: entry.surface, readings };
  allEntries.push(e);
  if (!bySurface.has(e.surface)) bySurface.set(e.surface, e);
  else {
    // merge readings
    const existing = bySurface.get(e.surface);
    for (const r of readings) {
      if (!existing.readings.includes(r)) existing.readings.push(r);
    }
  }
  for (const r of readings) {
    if (!byReading.has(r)) byReading.set(r, []);
    byReading.get(r).push(e);
  }
}

/** Count how many unused dictionary words start with a given sound */
function countContinuations(startSound, usedSet) {
  let n = 0;
  for (const e of allEntries) {
    for (const r of e.readings) {
      if (usedSet.has(r)) continue;
      if (endsWithN(r)) continue; // ん-ending are dead ends, still count as continuations? Yes for pressure
      if (getStartSound(r) === startSound) { n++; break; }
    }
  }
  return n;
}

function countAllContinuations(startSound, usedSet) {
  let n = 0;
  for (const e of allEntries) {
    for (const r of e.readings) {
      if (usedSet.has(r)) continue;
      if (getStartSound(r) === startSound) { n++; break; }
    }
  }
  return n;
}

  if (state.required) {
    el.soundBadge.style.display = '';
    el.nextSound.textContent = state.required;
    el.nextHint.innerHTML = `次は <strong>${state.required}</strong> で始まる言葉`;
  } else {
    el.soundBadge.style.display = 'none';
    el.nextHint.textContent = '好きな言葉でスタートできます';
  }
}

function renderHistory() {
  el.history.innerHTML = '';
  if (state.history.length === 0) {
    el.history.innerHTML = '<div class="empty-state">まだ言葉がありません</div>';
    return;
  }
  state.history.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'history-item ' + h.who;
    div.innerHTML = `
      <div class="who">${h.who === 'player' ? 'あなた' : 'PC'}</div>
      <div class="word">
        <div class="surface">${escapeHtml(h.surface)}</div>
        <div class="reading">（${escapeHtml(h.reading)}）</div>
      </div>
      <div class="num">#${i + 1}</div>`;
    el.history.appendChild(div);
  });
  // scroll to bottom
  const wrap = el.history.parentElement;
  wrap.scrollTop = wrap.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========== Lookup / validation ========== */
function findEntryByInput(input) {
  const raw = normalizeFW(input.trim());
  if (!raw) return null;

  // Try surface match (exact)
  if (bySurface.has(raw)) return bySurface.get(raw);
  // Try hiragana surface
  const hira = normalizeReading(raw);
  if (bySurface.has(hira)) return bySurface.get(hira);

  // Try as reading (kana-only word)
  if (byReading.has(hira)) {
    // prefer entry whose surface equals the reading, else first
    const list = byReading.get(hira);
    const exact = list.find(e => e.surface === hira || normalizeReading(e.surface) === hira);
    return exact || list[0];
  }

  // Also check if any entry has this surface in kana form of kanji... already covered
  return null;
}

/**
 * Pick a valid reading for the entry given previous required sound.
 * Returns reading string or null if none valid.
 */
function pickValidReading(entry, required) {
  const candidates = [];
  for (const r of entry.readings) {
    if (state.used.has(r)) continue;
    if (required) {
      if (getStartSound(r) !== required) continue;
    }
    candidates.push(r);
  }
  return candidates.length ? candidates : null;
}

function validatePlayerWord(input) {
  const trimmed = input.trim();
  if (!trimmed) return { ok: false, error: '言葉を入力してください。' };

  const entry = findEntryByInput(trimmed);
  if (!entry) return { ok: false, error: '辞書にない言葉です。別の言葉を試してください。' };

  const readings = pickValidReading(entry, state.required);
  if (!readings) {
    // Check why
    const allUsed = entry.readings.every(r => state.used.has(r));
    if (allUsed) return { ok: false, error: 'その言葉（読み）はすでに使われています。' };
    if (state.required) {
      return { ok: false, error: `「${state.required}」で始まる読みが必要です。` };
    }
    return { ok: false, error: '使えません。' };
  }

  // Prefer reading that continues chain; if multiple, pick first (or one matching input if kana)
  const inputHira = normalizeReading(trimmed);
  let chosen = readings.find(r => r === inputHira) || readings[0];

  if (endsWithN(chosen)) {
    // Valid play but player loses
    return { ok: true, entry, reading: chosen, loseByN: true };
  }

  return { ok: true, entry, reading: chosen, loseByN: false };
}

/* ========== Apply move ========== */
function applyMove(who, surface, reading) {
  state.used.add(reading);
  state.history.push({ who, surface, reading });
  state.required = getEndSound(reading);
  renderHistory();
  updateUI();
}

function endGame(winner, reason) {
  state.running = false;
  updateUI();
  if (winner === 'player') {
    showMessage('🎉 あなたの勝ち！ ' + reason, 'win');
  } else {
    showMessage('💻 コンピューターの勝ち… ' + reason, 'lose');
  }
}

/* ========== CPU AI ========== */
function gatherCpuCandidates() {
  const required = state.required;
  const list = [];
  for (const e of allEntries) {
    for (const r of e.readings) {
      if (state.used.has(r)) continue;
      if (endsWithN(r)) continue; // never play ん
      if (required && getStartSound(r) !== required) continue;
      list.push({ entry: e, reading: r });
    }
  }
  return list;
}

function cpuChoose(candidates) {
  if (candidates.length === 0) return null;
  const diff = state.difficulty;

  if (diff === 'easy') {
    // Prefer short common words; avoid endings with few continuations
    const scored = candidates.map(c => {
      const end = getEndSound(c.reading);
      const cont = countAllContinuations(end, new Set([...state.used, c.reading]));
      const len = c.reading.length;
      // higher score = better for easy (short + many continuations)
      let score = cont * 3 - len * 2;
      if (len <= 3) score += 5;
      if (len <= 4) score += 2;
      return { ...c, score, cont };
    });
    scored.sort((a, b) => b.score - a.score);
    // pick randomly among top 30%
    const top = scored.slice(0, Math.max(3, Math.ceil(scored.length * 0.3)));
    return top[Math.floor(Math.random() * top.length)];
  }

  if (diff === 'medium') {
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  // hard: prefer endings with fewer continuations (pressure player)
  const scored = candidates.map(c => {
    const end = getEndSound(c.reading);
    const cont = countAllContinuations(end, new Set([...state.used, c.reading]));
    return { ...c, cont };
  });
  scored.sort((a, b) => a.cont - b.cont);
  // Prefer low continuation; occasionally pick among worst 20%
  const pressure = scored.slice(0, Math.max(5, Math.ceil(scored.length * 0.25)));
  // Weight toward fewer continuations
  const weights = pressure.map((c, i) => pressure.length - i);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pressure.length; i++) {
    r -= weights[i];
    if (r <= 0) return pressure[i];
  }
  return pressure[0];
}

async function cpuTurn() {
  state.cpuThinking = true;
  updateUI();
  showMessage('考え中…', 'info');

  await new Promise(r => setTimeout(r, 400 + Math.random() * 600));

  const candidates = gatherCpuCandidates();
  const choice = cpuChoose(candidates);

  hideMessage();
  state.cpuThinking = false;

  if (!choice) {
    endGame('player', 'コンピューターが続く言葉を見つけられませんでした。');
    return;
  }

  applyMove('cpu', choice.entry.surface, choice.reading);

  // Check if CPU forced player into impossible? No - turn goes to player
  // If next required is ん somehow shouldn't happen
  if (endsWithN(choice.reading)) {
    // Should never happen
    endGame('player', 'コンピューターが「ん」で終わる言葉を出しました。');
    return;
  }

  state.turn = 'player';
  updateUI();
  el.wordInput.focus();
}

/* ========== Player submit ========== */
function submitPlayer() {
  if (!state.running || state.turn !== 'player' || state.cpuThinking) return;
  const input = el.wordInput.value;
  const result = validatePlayerWord(input);

  if (!result.ok) {
    showMessage(result.error, 'error');
    return;
  }

  hideMessage();
  el.wordInput.value = '';

  applyMove('player', result.entry.surface, result.reading);

  if (result.loseByN) {
    endGame('cpu', '「ん」で終わる言葉を出してしまいました。');
    return;
  }

  state.turn = 'cpu';
  updateUI();
  cpuTurn();
}

function newGame() {
  state.running = true;
  state.turn = 'player';
  state.required = null;
  state.used = new Set();
  state.history = [];
  state.difficulty = el.difficulty.value;
  state.cpuThinking = false;
  hideMessage();
  renderHistory();
  updateUI();
  el.wordInput.value = '';
  el.wordInput.focus();
  showMessage('ゲームスタート！好きな言葉を入力してください。', 'info');
  setTimeout(hideMessage, 2000);
}

function surrender() {
  if (!state.running) return;
  endGame('cpu', '降参しました。');
}

/* ========== Events ========== */
el.btnNew.addEventListener('click', newGame);
el.btnSubmit.addEventListener('click', submitPlayer);
el.btnSurrender.addEventListener('click', surrender);
el.wordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitPlayer();
  }
});
el.difficulty.addEventListener('change', () => {
  if (state.running) {
    state.difficulty = el.difficulty.value;
  }
});

// Auto-start ready UI
updateUI();
</script>
</body>
</html>
